<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width">
<div style="text-align:center;padding:20px">
  <p id="tip">还需点击 <span id="need">5</span> 次才能退出</p>
  <button onclick="clickBtn()">点我</button>
</div>
<script>
let n = 0, ok = false;
// 初始化：往历史栈压入2条当前页面记录，确保拦截生效
history.pushState(null, null, location.href);
history.pushState(null, null, location.href);
// 监听返回键
window.addEventListener('popstate', function() {
  if (!ok) {
    // 没解锁时，重新压入历史记录，阻止返回
    history.pushState(null, null, location.href);
    document.getElementById('tip').innerText = `还需点击 ${5 - n} 次才能退出`;
  }
}, false);
// 点击按钮逻辑
function clickBtn() {
  n++;
  document.getElementById('need').innerText = 5 - n;
  if (n >= 5) {
    ok = true;
    document.getElementById('tip').innerText = "已解锁，可以返回";
    // 安卓微信关闭页面
    if (typeof WeixinJSBridge !== 'undefined') {
      WeixinJSBridge.invoke('closeWindow', {}, function(res) {});
    }
  }
}
</script>
