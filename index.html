<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词语音识别</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
    color: #333;
}
.container {
    max-width: 900px;
    margin: 0 auto;
}
.header {
    text-align: center;
    color: white;
    margin-bottom: 30px;
}
.header h1 {
    font-size: 2.2em;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
}
.header p {
    margin-top: 10px;
    font-size: 1.1em;
    opacity: 0.9;
}
.mic-section {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
    margin-bottom: 30px;
}
.mic-btn {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    font-size: 50px;
    cursor: pointer;
    margin: 20px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s;
}
.mic-btn:hover { transform: scale(1.05); }
.mic-btn.listening {
    background: linear-gradient(135deg, #f093fb, #f5576c);
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(245, 87, 108, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(245, 87, 108, 0); }
}
.status {
    margin-top: 20px;
    font-size: 1.1em;
    color: #666;
}
.status.active { color: #764ba2; font-weight: bold; }
.result-box {
    background: white;
    border-radius: 20px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    text-align: center;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}
.phonetic {
    font-size: 1.3em;
    color: #888;
    margin-bottom: 10px;
}
.word-display {
    font-size: 3em;
    font-weight: bold;
    color: #667eea;
    margin-bottom: 15px;
}
.meaning {
    font-size: 1.3em;
    color: #555;
}
.placeholder {
    color: #bbb;
    font-size: 1.2em;
}
.history {
    background: white;
    border-radius: 20px;
    padding: 30px;
    margin-top: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
}
.history h3 {
    margin-bottom: 15px;
    color: #667eea;
}
.history-item {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #eee;
}
.history-item:last-child { border-bottom: none; }
.history-word {
    font-weight: bold;
    color: #333;
}
.history-meaning {
    color: #666;
}
.history-time {
    color: #999;
    font-size: 0.9em;
}
.error {
    color: #e74c3c;
    background: #fee;
    padding: 15px;
    border-radius: 10px;
    margin: 10px 0;
    display: none;
}
.clear-btn {
    margin-top: 15px;
    padding: 10px 25px;
    border: none;
    border-radius: 25px;
    background: #f5576c;
    color: white;
    cursor: pointer;
    font-size: 0.9em;
}
.clear-btn:hover { background: #e0485b; }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🎤 英语单词语音识别</h1>
        <p>说出英语单词，屏幕显示中文意思</p>
    </div>

    <div class="mic-section">
        <div class="mic-btn" id="micBtn">🎤</div>
        <div class="status" id="status">点击麦克风按钮开始</div>
        <div class="error" id="errorMsg"></div>
    </div>

    <div class="result-box" id="resultBox">
        <div class="placeholder">等待识别...</div>
    </div>

    <div class="history" id="historySection" style="display:none;">
        <h3>📝 识别历史</h3>
        <div id="historyList"></div>
        <button class="clear-btn" onclick="clearHistory()">清空历史</button>
    </div>
</div>

<script>
const wordDict = {
    'curious': { phonetic: '/ˈkjʊəriəs/', meaning: '好奇的；求知欲强的' },
    'company': { phonetic: '/ˈkʌmpəni/', meaning: '公司；商行；陪伴' },
    'personality': { phonetic: '/ˌpɜːsəˈnæləti/', meaning: '性格；个性' },
    'style': { phonetic: '/staɪl/', meaning: '方式；风格' },
    'revise': { phonetic: '/rɪˈvaɪz/', meaning: '修改；修订；复习' },
    'teenage': { phonetic: '/ˈtiːneɪdʒ/', meaning: '十几岁的；青少年的' },
    'teenager': { phonetic: '/ˈtiːneɪdʒə(r)/', meaning: '青少年' },
    'ballet': { phonetic: '/ˈbæleɪ/', meaning: '芭蕾；芭蕾舞剧' },
    'volunteer': { phonetic: '/ˌvɒlənˈtɪə(r)/', meaning: '志愿者' },
    'debate': { phonetic: '/dɪˈbeɪt/', meaning: '辩论；争论' },
    'prefer': { phonetic: '/prɪˈfɜː(r)/', meaning: '更喜欢；宁愿' },
    'content': { phonetic: '/ˈkɒntent/', meaning: '内容；满足的' },
    'movement': { phonetic: '/ˈmuːvmənt/', meaning: '运动；活动；移动' },
    'greenhouse': { phonetic: '/ˈɡriːnhaʊs/', meaning: '温室；暖房' },
    'clean up': { phonetic: '', meaning: '打扫；清理干净' },
    'suitable': { phonetic: '/ˈsuːtəbl/', meaning: '合适的；适用的' },
    'actually': { phonetic: '/ˈæktʃuəli/', meaning: '事实上；实际上' },
    'challenge': { phonetic: '/ˈtʃælɪndʒ/', meaning: '挑战；艰巨任务' },
    'title': { phonetic: '/ˈtaɪtl/', meaning: '标题；名称；职称' },
    'topic': { phonetic: '/ˈtɒpɪk/', meaning: '话题；标题' },
    'freshman': { phonetic: '/ˈfreʃmən/', meaning: '大一新生' },
    'confusing': { phonetic: '/kənˈfjuːzɪŋ/', meaning: '难以理解的；不清楚的' },
    'fluent': { phonetic: '/ˈfluːənt/', meaning: '流利的；流畅的' },
    'graduate': { phonetic: '/ˈɡrædʒuət/', meaning: '毕业；毕业生' },
    'recommend': { phonetic: '/ˌrekəˈmend/', meaning: '建议；推荐' },
    'sign up': { phonetic: '', meaning: '报名；注册' },
    'advanced': { phonetic: '/ədˈvɑːnst/', meaning: '高级的；先进的' },
    'literature': { phonetic: '/ˈlɪtrətʃə(r)/', meaning: '文学；文学作品' },
    'obviously': { phonetic: '/ˈɒbviəsli/', meaning: '显然；明显地' },
    'responsible': { phonetic: '/rɪˈspɒnsəbl/', meaning: '有责任的' },
    'solution': { phonetic: '/səˈluːʃn/', meaning: '解决办法；答案' },
    'schedule': { phonetic: '/ˈʃedjuːl/', meaning: '日程；安排' },
    'editor': { phonetic: '/ˈedɪtə(r)/', meaning: '编辑；编者' },
    'plate': { phonetic: '/pleɪt/', meaning: '盘子；碟子' },
    'adventure': { phonetic: '/ədˈventʃə(r)/', meaning: '冒险；奇遇' },
    'youth': { phonetic: '/juːθ/', meaning: '青春；青年时期' },
    'survival': { phonetic: '/səˈvaɪvl/', meaning: '生存；幸存' },
    'expert': { phonetic: '/ˈekspɜːt/', meaning: '专家；行家' },
    'behaviour': { phonetic: '/bɪˈheɪvjə(r)/', meaning: '行为；举止' },
    'generation': { phonetic: '/ˌdʒenəˈreɪʃn/', meaning: '一代；一代人' },
    'attract': { phonetic: '/əˈtrækt/', meaning: '吸引；引起' },
    'focus': { phonetic: '/ˈfəʊkəs/', meaning: '焦点；重点；聚焦' },
    'addicted': { phonetic: '/əˈdɪktɪd/', meaning: '沉溺于；上瘾的' },
    'adult': { phonetic: '/ˈædʌlt/', meaning: '成年人' },
    'castle': { phonetic: '/ˈkɑːsl/', meaning: '城堡；堡垒' },
    'apply': { phonetic: '/əˈplaɪ/', meaning: '申请；适用；涂' },
    'visa': { phonetic: '/ˈviːzə/', meaning: '签证' },
    'rent': { phonetic: '/rent/', meaning: '租用；出租；租金' },
    'extra-curricular': { phonetic: '/ˌekstrəkəˈrɪkjələ(r)/', meaning: '课外的' },
    'quit': { phonetic: '/kwɪt/', meaning: '停止；离开' },
    'responsible': { phonetic: '/rɪˈspɒnsəbl/', meaning: '有责任的' },
    'focus on': { phonetic: '', meaning: '集中于；关注' },
    'addicted to': { phonetic: '', meaning: '沉迷于' },
    'be attracted to': { phonetic: '', meaning: '被…吸引' },
    'suitable for': { phonetic: '', meaning: '适合…' },
    'sign up for': { phonetic: '', meaning: '报名参加' },
    'apply for': { phonetic: '', meaning: '申请' },
    'extra': { phonetic: '/ˈekstrə/', meaning: '额外的；附加的' },
    'responsibility': { phonetic: '/rɪˌspɒnsəˈbɪləti/', meaning: '责任；职责' }
};

const micBtn = document.getElementById('micBtn');
const status = document.getElementById('status');
const errorMsg = document.getElementById('errorMsg');
const resultBox = document.getElementById('resultBox');
const historyList = document.getElementById('historyList');
const historySection = document.getElementById('historySection');

let recognition = null;
let isListening = false;
let history = [];

function showWord(word, info) {
    resultBox.innerHTML = `
        <div class="phonetic">${info.phonetic}</div>
        <div class="word-display">${word}</div>
        <div class="meaning">${info.meaning}</div>
    `;
    
    // 添加到历史
    const now = new Date();
    const time = now.getHours().toString().padStart(2,'0') + ':' + 
                 now.getMinutes().toString().padStart(2,'0');
    
    history.unshift({ word, meaning: info.meaning, time });
    if (history.length > 20) history.pop();
    
    renderHistory();
}

function renderHistory() {
    if (history.length === 0) {
        historySection.style.display = 'none';
        return;
    }
    historySection.style.display = 'block';
    historyList.innerHTML = history.map(item => `
        <div class="history-item">
            <span class="history-word">${item.word}</span>
            <span class="history-meaning">${item.meaning}</span>
            <span class="history-time">${item.time}</span>
        </div>
    `).join('');
}

function clearHistory() {
    history = [];
    renderHistory();
}

// 计算编辑距离（模糊匹配用）
function editDistance(a, b) {
    const m = a.length, n = b.length;
    if (m === 0) return n;
    if (n === 0) return m;
    const dp = Array.from({length: m + 1}, () => Array(n + 1).fill(0));
    for (let i = 0; i <= m; i++) dp[i][0] = i;
    for (let j = 0; j <= n; j++) dp[0][j] = j;
    for (let i = 1; i <= m; i++) {
        for (let j = 1; j <= n; j++) {
            dp[i][j] = a[i-1] === b[j-1] 
                ? dp[i-1][j-1] 
                : 1 + Math.min(dp[i-1][j], dp[i][j-1], dp[i-1][j-1]);
        }
    }
    return dp[m][n];
}

// 匹配单词（精确 + 模糊）
function matchWord(w) {
    if (!w) return null;
    if (wordDict[w]) return { word: w, info: wordDict[w], exact: true };
    // 模糊匹配：找编辑距离最小且阈值内的词
    let best = null;
    let bestDist = Infinity;
    for (const key of Object.keys(wordDict)) {
        const d = editDistance(w, key);
        if (d < bestDist) {
            bestDist = d;
            best = key;
        }
    }
    // 阈值：单词长度的 30%，最多 3 个字母差异
    const threshold = Math.min(3, Math.ceil(Math.max(w.length, best.length) * 0.3));
    if (bestDist <= threshold && bestDist < Math.max(w.length, best.length)) {
        return { word: best, info: wordDict[best], exact: false, dist: bestDist };
    }
    return null;
}

function startRecognition() {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    
    if (!SpeechRecognition) {
        errorMsg.textContent = '您的浏览器不支持语音识别，请使用 Chrome 或 Edge 浏览器。';
        errorMsg.style.display = 'block';
        return;
    }
    
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 3;
    
    recognition.onstart = () => {
        isListening = true;
        micBtn.classList.add('listening');
        status.textContent = '正在聆听...请说出英语单词';
        status.classList.add('active');
        errorMsg.style.display = 'none';
    };
    
    let lastShown = '';
    
    recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';
        
        for (let i = event.resultIndex; i < event.results.length; i++) {
            if (event.results[i].isFinal) {
                finalTranscript += event.results[i][0].transcript;
            } else {
                interimTranscript += event.results[i][0].transcript;
            }
        }
        
        // 显示实时预览
        if (interimTranscript) {
            status.textContent = '识别中: ' + interimTranscript;
        }
        
        // 中间结果也即时匹配（快速显示）
        if (interimTranscript) {
            const words = interimTranscript.toLowerCase().split(/\s+/);
            for (let i = words.length - 1; i >= 0; i--) {
                const w = words[i].replace(/[.,!?;:"']/g, '');
                const match = matchWord(w);
                if (match && match.word !== lastShown) {
                    lastShown = match.word;
                    showWord(match.word, match.info);
                    break;
                }
            }
        }
        
        // 最终结果 + 使用所有 alternatives
        if (finalTranscript) {
            let found = null;
            // 先从最终结果匹配
            const words = finalTranscript.toLowerCase().split(/\s+/);
            for (let i = words.length - 1; i >= 0 && !found; i--) {
                const w = words[i].replace(/[.,!?;:"']/g, '');
                found = matchWord(w);
            }
            // 如果没找到，尝试所有 alternatives
            if (!found) {
                for (let i = event.resultIndex; i < event.results.length && !found; i++) {
                    if (event.results[i].isFinal) {
                        for (let j = 0; j < event.results[i].length && !found; j++) {
                            const alt = event.results[i][j].transcript.toLowerCase().trim();
                            const altWords = alt.split(/\s+/);
                            for (const aw of altWords) {
                                const clean = aw.replace(/[.,!?;:"']/g, '');
                                const m = matchWord(clean);
                                if (m) { found = m; break; }
                            }
                        }
                    }
                }
            }
            if (found) {
                lastShown = found.word;
                showWord(found.word, found.info);
            }
            lastShown = '';
        }
    };
    
    recognition.onerror = (event) => {
        if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
            errorMsg.textContent = '⚠️ 麦克风权限被拒绝！请点击地址栏左侧的 🔒 或 ⓘ 图标，将麦克风权限改为"允许"，然后刷新页面。';
            errorMsg.style.display = 'block';
            stopRecognition();
        }
        // 其他错误静默，自动重启
    };
    
    recognition.onend = () => {
        if (isListening) {
            setTimeout(() => {
                if (isListening) {
                    try { recognition.start(); } catch(e) {}
                }
            }, 200);
        } else {
            micBtn.classList.remove('listening');
            status.textContent = '点击麦克风按钮开始';
            status.classList.remove('active');
        }
    };
    
    try {
        recognition.start();
    } catch(e) {
        errorMsg.textContent = '启动失败，请点击麦克风按钮重试。';
        errorMsg.style.display = 'block';
    }
}

function stopRecognition() {
    isListening = false;
    if (recognition) {
        try { recognition.stop(); } catch(e) {}
    }
    micBtn.classList.remove('listening');
    status.textContent = '点击麦克风按钮开始';
    status.classList.remove('active');
}

micBtn.addEventListener('click', () => {
    if (isListening) {
        stopRecognition();
    } else {
        startRecognition();
    }
});

// 页面加载后自动开始
window.addEventListener('load', () => {
    setTimeout(startRecognition, 500);
});
</script>
</body>
</html>
